<style>
:root{--brand:#FF8B33;--brand-hi:#FF9A4C;--ink:#2A1A12;--soft:#FFF2E8;--line-b:#FFD9BC;--deep:#A9480A;
  --frame:#1E1612;--frame-2:#2C221D;--frame-text:#F4EEEA;--frame-dim:#A99A91;
  --muted:#F7F4F1;--line:#EEE8E4;--line-2:#E1D9D3;--text:#211813;--dim:#6D6159;--faint:#A0948C;--good:#0F8A57;
  --r-lg:16px;--r:12px;--r-sm:8px;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
[id]{scroll-margin-top:88px}
footer.site{background:#1E1612;color:#B9A597;padding:56px 0 28px;font-size:14px}
footer.site .fwrap{max-width:1160px;margin:0 auto;padding:0 24px}
footer.site .fgrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px}
footer.site .fbrand img{height:30px;display:block;margin-bottom:14px}
footer.site .fbrand p{max-width:300px;line-height:1.6;margin:0 0 18px;color:#B9A597}
footer.site .fbrand a.fcta{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;background:#FF8B33;color:#2A1A12;font-weight:600;text-decoration:none;transition:background-color .15s ease}
footer.site .fbrand a.fcta:hover{background:#FF9A4C}
footer.site h4{font-size:13px;font-weight:600;color:#fff;margin:4px 0 14px}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}

footer.site ul a:hover{color:#FF8B33}
footer.site .fbottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#8C7B70}
@media (max-width:760px){footer.site .fgrid{grid-template-columns:1fr 1fr}footer.site .fbrand{grid-column:1/-1}}
body{margin:0;background:#fff;color:var(--text);font:16px/1.55 "Geist","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:inherit}
svg{width:18px;height:18px;flex:none;fill:currentColor}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r);border:1px solid var(--line-2);background:#fff;color:var(--text);
  font:inherit;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{background:var(--muted);border-color:#D4CAC3}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--ink)}.btn.primary:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.dark:hover{background:#3A2C25;border-color:#3A2C25}
.btn.sm{height:38px;padding:0 14px;font-size:14px}
.kicker{font-size:15px;font-weight:600;color:var(--deep);margin-bottom:12px}
h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.035em;line-height:1.08;font-weight:600;color:var(--ink)}
h2 span{color:var(--faint)}
.sub{color:var(--dim);font-size:16px;margin-top:10px;max-width:600px}
section{padding:64px 0;position:relative}

/* ---------- motion: things ease in as they scroll into view */
.js .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.js .reveal.in{opacity:1;transform:none}

/* ---------- nav: a solid bar */
header.nav{position:sticky;top:0;z-index:20;background:#fff;color:var(--text);border-bottom:1px solid transparent;transition:border-color .2s ease}
header.nav.stuck{border-color:var(--line)}
header.nav .wrap{display:flex;align-items:center;gap:24px;height:60px;max-width:1180px}
header.nav img{height:40px;display:block}
header.nav nav{display:flex;gap:4px;flex:1;justify-content:center;font-size:15px;font-weight:500}
header.nav nav a{text-decoration:none;color:var(--dim);padding:8px 14px;border-radius:var(--r);transition:color .15s ease,background-color .15s ease}
header.nav nav a:hover{color:var(--text);background:var(--muted)}
header.nav .signin{color:var(--text);text-decoration:none;font-weight:500;font-size:15px;padding:8px 12px;border-radius:var(--r);transition:background-color .15s ease}
header.nav .signin:hover{background:var(--muted)}
header.nav .btn.cta{height:40px;padding:0 18px;border-radius:999px;font-size:15px}

/* ---------- hero */
.hero{position:relative;overflow:hidden;background:#fff;padding:28px 0 0}
.hero-top{position:relative}
.ga-bg{position:absolute;top:24px;bottom:-256px;left:50%;width:100vw;transform:translateX(-50%);pointer-events:none;user-select:none;z-index:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,black 14%,black 70%,transparent 100%)}
.hero-copy{position:relative;z-index:10;max-width:820px;margin:0 auto;padding:0 24px;text-align:center}
.announce{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--text);background:#fff;border:1px solid var(--line-2);
  padding:6px 8px 6px 14px;border-radius:999px;text-decoration:none;margin-bottom:18px;transition:border-color .15s ease}
.announce:hover{border-color:#D4CAC3}
.announce i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
.announce .livepill{padding:3px 10px 3px 9px;font-size:12px}
.announce .as{display:none}
@media (max-width:560px){.announce{font-size:12px;gap:8px;padding:5px 12px 5px 6px;max-width:100%}.hero a.announce b{display:none}.hero a.announce .al{display:none}.hero a.announce .as{display:inline}.hero a.announce{white-space:nowrap;font-size:13px;padding:5px 14px 5px 6px}}
.announce b{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--deep);background:var(--soft);padding:3px 10px;border-radius:999px}
.announce b svg{width:14px;height:14px}
@keyframes pulse{50%{opacity:.3}}
h1{font-size:clamp(30px,3.7vw,46px);line-height:1.08;letter-spacing:-.045em;font-weight:600;color:var(--ink)}
h1 .hl{display:inline-block;background:var(--brand);color:var(--ink);padding:0 .22em .06em;border-radius:.24em;margin-top:.08em}
.lede{font-size:16px;color:var(--dim);margin:12px auto 18px;max-width:520px}
.ask{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:6px;flex:0 1 560px;transition:border-color .2s ease}
.bar:focus-within{border-color:var(--brand)}
.bar form{display:flex;gap:6px;align-items:center}
.bar .in{flex:1;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;min-width:0}
.bar .in svg{color:var(--faint);width:20px;height:20px}
.bar input{flex:1;min-width:0;height:46px;border:0;outline:0;font:inherit;font-size:16px;background:transparent;color:var(--text)}
.bar input::placeholder{color:var(--faint)}
.bar .btn{height:46px;border-radius:999px}
.ask .or{color:var(--faint);font-size:15px}
.ask .up{height:58px;border-radius:999px;padding:0 22px}
.notes{display:flex;gap:8px 16px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:12px}
.notes span{display:inline-flex;align-items:center;gap:6px}.notes svg{width:16px;height:16px;color:var(--good)}
.reel{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:28px auto 0;padding:0 24px 44px;max-width:820px}
.reel figure{margin:0;flex:0 1 165px;display:flex;flex-direction:column;align-items:center;gap:8px}
.reel figure.mid{flex-basis:190px}
.phone{position:relative;width:100%;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:var(--frame);border:6px solid var(--frame)}
.phone video{width:100%;height:100%;object-fit:cover;display:block}
.phone .snd{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(30,22,18,.72);color:#fff;
  display:grid;place-items:center;cursor:pointer;transition:background-color .15s ease}
.phone .snd:hover{background:rgba(30,22,18,.92)}
.reel figcaption{font-size:14px;color:var(--dim);text-align:center}
.reel figcaption b{color:var(--ink);font-weight:600}
.reel-note{position:relative;z-index:1;text-align:center;font-size:13px;color:var(--faint);margin:-40px 0 0;padding-bottom:36px}
.sized{border-top:1px solid var(--line);position:relative;background:#fff}
.sized p{text-align:center;font-size:13px;color:var(--faint);padding-top:20px}
.plats{display:flex;justify-content:center;gap:24px 64px;flex-wrap:wrap;padding:24px 24px 26px}
.plats>div{display:flex;align-items:center;gap:26px;flex-wrap:wrap;justify-content:center}
.plats p{font-size:14px;color:var(--faint);margin:0;padding:0}
.plats span{font-size:20px;font-weight:600;color:var(--dim)}
.marquee{overflow:hidden;padding:10px 0 22px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.marquee div{display:flex;gap:64px;width:max-content;animation:slide 26s linear infinite;font-size:20px;font-weight:600;color:var(--dim);white-space:nowrap}
@keyframes slide{to{transform:translateX(-50%)}}

/* ---------- open source band */
.open{background:var(--frame);color:var(--frame-text);padding:56px 0}
.open h2{color:#fff;max-width:760px}.open h2 span{color:var(--brand)}
.open .sub{color:var(--frame-dim)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.1);border-radius:var(--r-lg);overflow:hidden;margin-top:30px}
.trio div{background:var(--frame);padding:22px 24px}
.trio b{display:block;font-size:34px;font-weight:600;letter-spacing:-.04em;color:#fff;line-height:1}
.trio b small{font-size:16px;font-weight:500;color:var(--frame-dim);letter-spacing:0;margin-left:6px}
.trio span{display:block;color:var(--frame-dim);margin-top:12px;font-size:15px}

/* ---------- how it works */
.steps{margin-top:36px;position:relative}
.steps::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.step{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:20px 0;position:relative}
.step .no{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line-2);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink);z-index:1}
.step:nth-child(even) .txt{order:2}
.step .txt{max-width:420px}.step:nth-child(odd) .txt{justify-self:end}
.step h3{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin-bottom:10px}
.step .txt p{color:var(--dim);font-size:16px}
.mock{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px;max-width:440px;width:100%;font-size:14px}
.step:nth-child(even) .mock{justify-self:end}
.field.ph{color:var(--faint)}
.mock.result{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.mock.result video{width:150px;aspect-ratio:9/16;border-radius:var(--r);object-fit:cover;background:var(--frame);display:block}
.acts{display:flex;flex-direction:column;gap:8px}
.acts span{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);font-weight:500;color:var(--text)}
.acts span.pri{background:var(--brand);border-color:var(--brand);color:var(--ink)}
.mock .lab{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:10px}
.field{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);color:var(--text);margin-bottom:10px}
.field svg{color:var(--faint)}
.drop{border:1px dashed var(--line-2);border-radius:var(--r);padding:16px;text-align:center;color:var(--faint);margin-bottom:14px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chips span{flex:1;height:36px;border-radius:var(--r);border:1px solid var(--line);display:grid;place-items:center;font-weight:500;color:var(--dim)}
.chips span.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mock .go{height:44px;border-radius:var(--r);background:var(--brand);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.src{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--r);background:var(--soft);margin-bottom:14px}
.src i{width:44px;height:44px;border-radius:var(--r-sm);background:linear-gradient(150deg,#f2b36b,#c9652f 55%,#3d1f14);flex:none}
.src b{display:block;font-weight:600;color:var(--ink)}.src span{font-size:12px;color:var(--dim)}
.prog{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.prog div{display:flex;align-items:center;gap:10px;color:var(--faint)}
.prog div i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.in .prog div{animation:tick 6s var(--ease) infinite;animation-delay:calc(var(--i) * .9s)}
.in .prog div i{animation:tickdot 6s var(--ease) infinite;animation-delay:calc(var(--i) * .9s)}
@keyframes tick{0%,8%{color:var(--faint)}14%,100%{color:var(--text)}}
@keyframes tickdot{0%,8%{border-color:var(--line-2);background:transparent}14%,100%{border-color:var(--good);background:var(--good)}}
.meterbar{height:6px;border-radius:99px;background:var(--muted);overflow:hidden;margin-top:14px}
.meterbar i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px}
.in .meterbar i{animation:fillbar 6s var(--ease) infinite}
@keyframes fillbar{0%{width:4%}75%,100%{width:100%}}
.cliprow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cliprow:first-of-type{border-top:0}
.cliprow .th{width:46px;aspect-ratio:9/16;border-radius:6px;flex:none}
.cliprow b{display:block;font-weight:600;color:var(--ink)}
.cliprow span{font-size:12px;color:var(--dim)}
.cliprow .sc{margin-left:auto;font-weight:700;font-size:13px;background:var(--brand);color:var(--ink);padding:3px 9px;border-radius:999px}
.judgebars{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;flex-direction:column;gap:9px}
.jb{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;font-size:12px;color:var(--dim)}
.jb .t{height:6px;border-radius:99px;background:var(--muted);overflow:hidden}
.jb .t i{display:block;height:100%;width:0;background:var(--brand);border-radius:99px;transition:width 1.2s var(--ease) .3s}
.in .jb .t i{width:var(--v)}
.jb b{color:var(--ink);font-size:12px;text-align:right}

/* ---------- features */
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:32px}
.cell{border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:16px;background:#fff;overflow:hidden}
.cell h3{font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--ink);margin-bottom:8px}
.cell p{color:var(--dim);font-size:15px;max-width:440px}
.cell .art{margin-top:auto;background:var(--muted);border-radius:var(--r);padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.caps{display:flex;gap:10px}
.caps img{flex:1;min-width:0;aspect-ratio:9/16;object-fit:cover;border-radius:var(--r-sm);display:block;background:var(--frame)}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow span{flex:1 1 120px;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;font-weight:600;color:var(--ink);font-size:14px}
.flow span svg{color:var(--deep)}
.flow span small{font-weight:400;color:var(--dim);font-size:12px}
.flow span.hot{background:var(--soft);border-color:var(--line-b)}
.flow>b{color:var(--faint);font-weight:400}.flow>b svg{width:16px;height:16px}
.ledger span{display:inline-flex;align-items:center;gap:10px;color:var(--text)}.ledger span svg{color:var(--deep)}
.caps div{flex:1;aspect-ratio:9/12;border-radius:var(--r-sm);display:grid;place-items:end center;padding-bottom:14px;font-weight:800;font-size:13px;color:#fff;letter-spacing:.2px}
.caps div b{color:#FFE600}
.liverow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
.livepill{display:inline-flex;align-items:center;gap:6px;background:#E5323F;color:#fff;font-weight:600;font-size:12px;padding:2px 9px;border-radius:999px}
.livepill i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{50%{opacity:.3}}
.eq{display:flex;align-items:flex-end;gap:3px;height:52px}
.eq i{flex:1;background:var(--brand);border-radius:2px;height:20%;animation:eq 1.6s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -.13s)}
@keyframes eq{to{height:var(--h)}}
.ledger{display:flex;flex-direction:column;gap:0;font-size:13px}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line-2);color:var(--dim)}
.ledger div:first-child{border-top:0}
.ledger b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.ledger .plus b{color:var(--good)}
.js .ledger div{opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:calc(var(--i) * .25s + .2s)}
.js .in .ledger div{opacity:1;transform:none}

/* ---------- built for */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.tab{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font:inherit;font-weight:500;font-size:15px;color:var(--dim);cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease}
.tab:hover{background:var(--muted);color:var(--text)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;display:grid;grid-template-columns:1.25fr .75fr;gap:36px;align-items:center;animation:fadeup .5s var(--ease)}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}}
.panel .who{font-size:15px;font-weight:600;color:var(--deep);margin-bottom:12px}
.panel .pain{font-size:20px;line-height:1.3;letter-spacing:-.02em;font-weight:500;color:var(--ink)}
.panel .fix{color:var(--dim);margin-top:16px;font-size:16px}
.ft{background:var(--muted);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
.ft small{font-size:13px;font-weight:500;color:var(--faint);display:block;margin-bottom:2px}
.ft b{font-weight:600;color:var(--ink);font-size:17px}
.ft .arrow{color:var(--brand)}

/* ---------- faq + closing */
.faqgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:40px}
details{border-top:1px solid var(--line);padding:14px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;font-size:16px;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:14px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--faint);font-weight:400;font-size:24px;line-height:1;transition:transform .25s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--dim);margin-top:12px;font-size:16px}
.closing{text-align:center;background:radial-gradient(ellipse 70% 90% at 50% 100%,#FFEBDA 0%,#FFF8F2 55%,#fff 85%);border-top:1px solid var(--line)}
.closing h2{margin:0 auto;max-width:720px}.closing .sub{margin:10px auto 24px}





@media (max-width:960px){
  .hero{padding-top:32px}.reel{gap:10px;margin-top:28px}.reel figure:not(.mid){flex-basis:150px}
  header.nav nav{display:none}header.nav .wrap{justify-content:space-between}
  section{padding:48px 0}.open{padding:44px 0}
  .trio,.bento,.faqgrid,.panel{grid-template-columns:1fr}.faqgrid{gap:24px}.panel{padding:26px;gap:24px}
  .steps::before{left:20px}.step{grid-template-columns:1fr;gap:20px;padding:26px 0 26px 56px}
  .step .no{left:20px;top:26px;transform:translateX(-50%)}
  .step:nth-child(even) .txt{order:0}.step .txt,.step:nth-child(odd) .txt{justify-self:start;max-width:none}.step:nth-child(even) .mock{justify-self:start}
}
@media (max-width:560px){.bar{border-radius:var(--r-lg);flex-basis:100%}.bar form{flex-direction:column;align-items:stretch}.bar .btn{width:100%;border-radius:var(--r)}.ask .or{display:none}.ask .up{width:100%;height:50px}header.nav .signin{display:none}.reel figure:not(.mid){display:none}.reel figure.mid{flex-basis:260px}.mock.result{grid-template-columns:110px 1fr}.mock.result video{width:110px}.trio b{font-size:36px}.notes span+span::before{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.js .reveal,.js .ledger div{opacity:1;transform:none}.jb .t i{width:var(--v)}.meterbar i{width:70%}}

<body data-studio="landing">
<!-- STAN_PAGE -->
<script>document.querySelectorAll(".fy").forEach(e => e.textContent = new Date().getFullYear());</script>

<script>
const _y = document.getElementById("year"); if (_y) _y.textContent = new Date().getFullYear();
const navEl = document.getElementById("nav");
addEventListener("scroll", () => navEl.classList.toggle("stuck", scrollY > 4), {passive:true});
const startAscii = () => { try { GradientASCII(document.getElementById("heroAscii"), {colors: ["#b2bcb5", "#ffffff", "#cfd6d1", "#dce2dc", "#edf0ec"], shape: "horizon", lightMode: true, cellSize: 16, density: 0.8, glyphOpacity: 0.26, gradientOpacity: 0.32, glow: 0.06, grain: 0.06, mouseInteraction: false, clickEffect: "none"}); } catch {} };
window.GradientASCII ? startAscii() : addEventListener("load", startAscii, {once:true});
try {
  const lz = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if (e.isIntersecting) { v.preload = "auto"; v.play().catch(() => {}); } else v.pause(); }), {threshold:.4});
  document.querySelectorAll("video.lazyplay").forEach(v => lz.observe(v));
} catch {}
const $$ = s => [...document.querySelectorAll(s)];
// things ease in as they scroll into view. Checked on scroll, on a timer and by an observer, so a section can
// never stay invisible if one of those is not available.
let waiting = $$(".reveal");
function check() {
  const h = innerHeight || document.documentElement.clientHeight;
  waiting = waiting.filter(e => { if (e.getBoundingClientRect().top < h * .92) { e.classList.add("in"); return false; } return true; });
}
addEventListener("scroll", check, {passive:true}); addEventListener("resize", check); addEventListener("load", check);
const timer = setInterval(() => { check(); if (!waiting.length) clearInterval(timer); }, 400);
try { const io = new IntersectionObserver(check, {threshold:[0, .1]}); waiting.forEach(e => io.observe(e)); } catch {}
check();


// who it's for
const WHO = [
  ["Clippers", "A streamer is live for six hours and the campaign pays per view. The clip that wins is the one posted first.", "Stan Clips records the stream, checks it as often as every minute and has captioned clips ready while the stream is still going. You pick, post and move to the next creator.", "Six-hour live streams", "Clips ready before it ends"],
  ["Streamers", "The best moment of a four-hour stream is somewhere in the VOD. Finding it the next morning is the job nobody wants.", "Paste the link. The moments with the strongest hooks and reactions come back cut, captioned and ranked, ready for Shorts and Reels while the stream is still fresh.", "Multi-hour VODs", "Highlights ranked by score"],
  ["Podcasters", "Ninety minutes recorded, two clips posted. The rest of the episode never leaves the feed it was published in.", "Every episode comes back as a set of captioned vertical clips, each scored, so the week's posts are chosen in a minute instead of an afternoon of scrubbing.", "60 to 120 minute episodes", "A scored set of clips per episode"],
  ["Agencies", "Ten creators, ten streams a week, one editor. Clipping is what every client asks for and the thing that does not scale.", "Give each creator their own workspace with its own style and posting rules. One server looks after all of them.", "Client streams and recordings", "A workspace of clips per client"],
  ["Marketing teams", "Webinars and product demos are recorded, filed and forgotten. Turning them into social content never makes it onto a sprint.", "The recording goes in the same afternoon and a set of captioned clips comes out, each with a title and description already written.", "Webinars and demos", "Social clips, the same afternoon"]];
const tabs = document.getElementById("tabs"), panel = document.getElementById("panel");
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function show(i) {
  tabs.innerHTML = WHO.map((w, n) => `<button class="tab" role="tab" aria-selected="${n === i}" data-i="${n}">${esc(w[0])}</button>`).join("");
  const w = WHO[i];
  panel.style.animation = "none"; panel.offsetWidth; panel.style.animation = "";
  panel.innerHTML = `<div><p class="who">${esc(w[0])}</p><p class="pain">${esc(w[1])}</p><p class="fix">${esc(w[2])}</p></div>
    <div class="ft"><div><small>From</small><b>${esc(w[3])}</b></div><div class="arrow"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"/></svg></div><div><small>To</small><b>${esc(w[4])}</b></div></div>`;
}
tabs.addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) show(Number(b.dataset.i)); });
show(0);

// the link bar: remember the link, then sign up (or go straight in if already signed in)
let signedIn = false;
$$(".linkform").forEach(f => f.addEventListener("submit", e => {
  e.preventDefault();
  const v = f.link.value.trim();
  try { if (v) sessionStorage.setItem("peakcut_link", v); } catch {}
  location.href = signedIn ? "/app" : "/signup";
}));

fetch("/api/auth/me").then(r => r.json()).then(d => {
  if (!d.user) return;
  signedIn = true;
  $$('[data-auth="in"]').forEach(e => e.remove());
  $$('[data-auth="up"]').forEach(e => { e.href = "/app"; e.textContent = "Open Stan Clips"; });
  $$('[data-auth="up2"]').forEach(e => { e.href = "/app"; });
}).catch(() => {});
</script>
