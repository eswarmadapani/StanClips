<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | Stan Clips</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{SITE}}/{{PAGE_PATH}}">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<style>
:root{--brand:#FF8B33;--ink:#2A1A12;--deep:#A9480A;--muted:#F7F4F1;--line:#EEE8E4;--text:#211813;--dim:#6D6159;--faint:#A0948C;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--text);font:16px/1.7 "Geist","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--deep)}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:2}
.bar{max-width:860px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bar img{height:30px;display:block}
.bar nav{margin-left:auto;display:flex;gap:2px;padding:3px;background:var(--muted);border-radius:10px;overflow-x:auto;max-width:100%}
.bar nav a{font-size:14px;font-weight:600;color:var(--dim);text-decoration:none;padding:6px 12px;border-radius:8px;white-space:nowrap;transition:background-color .15s ease,color .15s ease}
.bar nav a:hover{background:#EDE3DB;color:var(--text)}
body[data-page=privacy] nav a[href="/privacy"],body[data-page=terms] nav a[href="/terms"],
body[data-page=acceptable-use] nav a[href="/acceptable-use"]{background:var(--brand);color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:40px 20px 80px}
article{display:none}
body[data-page=privacy] #privacy,body[data-page=terms] #terms,body[data-page=acceptable-use] #acceptable-use{display:block}
h1{font-size:clamp(30px,4vw,40px);line-height:1.15;letter-spacing:-.03em;margin:0 0 6px;color:var(--ink)}
.updated{color:var(--faint);font-size:14px;margin:0 0 28px}
h2{font-size:19px;letter-spacing:-.01em;margin:34px 0 8px;color:var(--ink)}
p,li{color:#3B2E27}
ul{padding-left:20px}
li{margin:4px 0}
.box{background:var(--muted);border-radius:12px;padding:16px 18px;margin:18px 0}
.caps{font-weight:600}
footer.site{background:#1E1612;color:#B9A597;padding:56px 0 28px;font-size:14px}
footer.site .fwrap{max-width:1160px;margin:0 auto;padding:0 24px}
footer.site .fgrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px}
footer.site .fbrand img{height:30px;display:block;margin-bottom:14px}
footer.site .fbrand p{max-width:300px;line-height:1.6;margin:0 0 18px;color:#B9A597}
footer.site .fbrand a.fcta{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;background:#FF8B33;color:#2A1A12;font-weight:600;text-decoration:none;transition:background-color .15s ease}
footer.site .fbrand a.fcta:hover{background:#FF9A4C}
footer.site h4{font-size:13px;font-weight:600;color:#fff;margin:4px 0 14px}
footer.site ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
footer.site ul a{color:#B9A597;text-decoration:none;transition:color .15s ease}
footer.site ul a:hover{color:#FF8B33}
footer.site .fbottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:44px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#8C7B70}
@media (max-width:760px){footer.site .fgrid{grid-template-columns:1fr 1fr}footer.site .fbrand{grid-column:1/-1}}
html{scroll-behavior:smooth}
article{animation:legalin .35s ease both}
@keyframes legalin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){article{animation:none}}
</style>
<!-- STAN_THEME -->
</head>
<body data-studio="legal" data-page="{{PAGE}}">
<!-- STAN_PAGE -->
<script>document.querySelectorAll(".fy").forEach(e => e.textContent = new Date().getFullYear());</script>
<script>
// switch between the three pages in place: a short fade, the address and title follow
const TITLES = {terms: "Terms of Service", privacy: "Privacy Policy", "acceptable-use": "Acceptable Use Policy"};
function showLegal(page, push) {
  if (!TITLES[page]) return false;
  document.body.dataset.page = page;
  document.title = TITLES[page] + " | Stan Clips";
  const art = document.getElementById(page); art.style.animation = "none"; art.offsetWidth; art.style.animation = "";
  if (push) history.pushState({page}, "", "/" + page);
  window.scrollTo({top: 0, behavior: "smooth"});
  return true;
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]"); if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const page = a.getAttribute("href").replace(/^\//, "");
  if (TITLES[page] && showLegal(page, page !== document.body.dataset.page)) e.preventDefault();
});
addEventListener("popstate", () => showLegal(location.pathname.replace(/^\//, ""), false));
</script>
</body>
</html>
